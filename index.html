<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="あなたに似合うフランス手芸の世界診断">
  <title>あなたに似合う フランス手芸の世界診断</title>
  <link rel="stylesheet" href="style.css?v=20260925-3">
</head>
<body>
  <main>
    <section class="hero" id="start">
      <div class="hero__shade"></div>
      <img class="hero__image" src="assets/header.jpg" alt="刺繍をほどこした小箱">
      <div class="hero__content">
        <p class="eyebrow">French Handicraft Portrait</p>
        <h1>あなたに似合う<br><em>フランス手芸の世界</em>診断</h1>
        <p class="hero__copy">8つの小さな問いから、あなたの暮らしに寄り添う<br>フランス手芸の世界をご案内します。</p>
        <button class="button button--light" id="beginButton">診断をはじめる <span>→</span></button>
      </div>
    </section>

    <section class="intro" id="intro">
      <p class="eyebrow">A quiet moment for you</p>
      <h2>好きな色、心惹かれる空間、<br>手仕事に求めるもの。</h2>
      <p>直感で選ぶ8つの答えが、あなたのための手芸の扉をひらきます。<br>約1分で、フランスの優雅な時間へ。</p>
      <button class="button" id="introButton">診断をはじめる <span>→</span></button>
    </section>

    <section class="quiz" id="quiz" aria-live="polite" hidden>
      <div class="quiz__top"><span id="progressText">1 / 8</span><span>French Handicraft</span></div>
      <div class="progress"><i id="progressBar"></i></div>
      <div id="questionCard" class="question-card"></div>
      <button class="back" id="backButton" type="button">← 前の質問へ</button>
    </section>

    <section class="result" id="result" hidden style="display:none">
      <div class="result__content">
        <p class="eyebrow">Your French Handicraft Portrait</p>
        <p class="result__lead">あなたの世界は</p>
        <h2 id="resultTitle"></h2>
        <p id="resultTheme" class="result__theme"></p>
        <div class="ornament">✦</div>
        <p id="resultCopy" class="result__copy"></p>
        <div class="recommendation"><span>おすすめ</span><strong id="resultRecommend"></strong></div>
        <div class="result__visual">
          <img id="resultImage" src="" alt="">
          <div class="result__visual-shade"></div>
        </div>
        <div class="result__actions">
          <a class="button" href="https://french-handicraft-class.sanasa.chatgpt.site" target="_blank" rel="noreferrer">レッスンを作ってみる <span>→</span></a>
          <a class="text-link" href="https://french-handicraft-class.sanasa.chatgpt.site" target="_blank" rel="noreferrer">オーダー制作について見る</a>
        </div>
        <button class="restart" id="restartButton" type="button">もう一度診断する</button>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
